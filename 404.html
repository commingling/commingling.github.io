<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - 页面未找到 | commingling</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    .not-found-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .not-found-box {
      max-width: 500px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      box-shadow: var(--shadow-md);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      font-family: var(--font-mono);
      line-height: 1;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--accent) 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 64 64" fill="none">
            <rect width="64" height="64" rx="14" fill="#2563eb" />
            <path d="M18 20 L30 32 L18 44" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="34" y1="44" x2="46" y2="44" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
        <span>commingling</span>
      </a>

      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" type="button" title="切换深色/浅色模式" aria-label="切换模式">
          <svg id="sun-icon" style="display:none; width:18px; height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg id="moon-icon" style="display:block; width:18px; height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="not-found-wrapper">
    <div class="not-found-box">
      <div class="error-code">404</div>
      <h1 style="font-size: 1.4rem; margin-bottom: 12px; font-weight: 700;">页面或资源未找到</h1>
      <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 0.95rem;">
        你访问的路径不存在或已被移至新地址。<br>页面将在 <span id="countdown" style="font-weight: 700; color: var(--accent);">5</span> 秒后自动返回首页。
      </p>
      <a href="/" class="btn btn-primary" style="justify-content: center; width: 100%;">立即返回个人主页</a>
    </div>
  </main>

  <script src="/assets/script.js"></script>
  <script>
    let timeLeft = 5;
    const countdownEl = document.getElementById('countdown');
    const timer = setInterval(() => {
      timeLeft--;
      if (countdownEl) countdownEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = '/';
      }
    }, 1000);
  </script>
</body>
</html>
